[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galnx"
version = "0.1.0"
description = "GalNX - a workbench that ports PC visual novels to Nintendo Switch (engine adapters, manifests, self-contained NSP packaging, verification)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.scripts]
galnx = "galnx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]