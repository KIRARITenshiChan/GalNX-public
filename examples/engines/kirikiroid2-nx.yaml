# Engine descriptor for the Kirikiroid2-NX adapter (docs/engines/README.md).
# First self-contained-NSP engine: a pinned upstream checkout is patched with
# nine GalNX patches (A/B/C packaging, D/E controller + save/load, F clean exit,
# G mapping v2, H input tweaks, I exit-save + held mouse) and built against
# seven self-built Switch portlibs.
# Chains: docs/builds/009-k2nx-selfcontained-build.md (A/B/C),
#         docs/builds/010-k2nx-controller-saveload.md (D/E, A4 NSP),
#         docs/builds/011-k2nx-exit-crash-fix.md (F, exit crash),
#         docs/builds/012-k2nx-cn-content.md (CN content packs + A6 NSP),
#         docs/builds/014-k2nx-input-tweaks.md (H, A9 NSP),
#         docs/builds/015-k2nx-save-exit-drag.md (I, A10 NSP).
id: kirikiroid2-nx
display_name: Kirikiroid2-NX
upstream_url: https://github.com/Erige005/Kirikiroid2-NX
pinned_commit: e96b6034c292c6ccdb099823ab6a0a6b505f77f3
pinned_version: "v1.0.1 (e96b6034, 2026-10-18)"
license_spdx: NOASSERTION
license_url: https://github.com/Erige005/Kirikiroid2-NX/blob/main/LICENSE
license_notes: >-
  LICENSE (44184 bytes) is the KiriKiri BSD-style text, which is not a recognised
  SPDX identifier, so license_spdx stays NOASSERTION. The repo root
  THIRD_PARTY_NOTICES.md records the bundled components (FFmpeg LGPL-2.1,
  OpenCV BSD-3-Clause, cocos2d-x MIT, UnRAR redistribution restrictions), and
  docs/builds/patches/k2nx-switch/LICENSE keeps the upstream license text
  next to the GalNX patch stack. A redistributed NSP must carry all of those
  notices.
target_kind: self_contained_nsp
build_backend: cmake-switch
capabilities:
  graphics:
    supported: true
    verification: game_verified
    backend: cocos2d-x-3.11.1-egl
    note: >-
      cocos2d-x 3.11.1 renderer on Switch EGL; Citron Nightly 0237a9b88 renders
      the title screen and the script at 60 FPS. Device-verified with the A10
      self-contained NSP (Pilot-01, README Pilot table).
  movie:
    supported: true
    verification: device_verified
    note: >-
      The CN pilot swaps movie.xp3 for the Chinese-subtitled opening and the
      device regression list covers the Chinese OP and audio playback
      (docs/pilot/P4-device-runbook.md section 12.2). The bundled FFmpeg 3.2.19
      portlib decodes the title's own movie format; no other title has been
      checked on hardware yet.
  audio:
    supported: true
    verification: device_verified
    note: >-
      The FFmpeg/audio path is part of the A10 device regression (Chinese OP and
      audio in docs/pilot/P4-device-runbook.md section 12.2). No mixer timing
      measurements were taken on hardware.
  input:
    supported: true
    verification: game_verified
    note: >-
      Switch pad buttons map to VK_* through the Kirikiroid2Preference.xml
      KeyMap plus patches D/E/G/H/I (virtual cursor, quick save/load hotkeys,
      MINUS quit, hold-R Ctrl skip, ZR/ZL held mouse). Device-verified by the
      user in the A10 acceptance (Pilot-01, README Pilot table).
  save:
    supported: true
    verification: device_verified
    note: >-
      Pad-only save/load through patches D/E: Y toggles the virtual mouse
      cursor, D-Pad moves it, A/B are left/right click, L quick saves, R opens
      the native LOAD screen, PLUS opens SAVE, ZR loads slot 10 and ZL forces
      the system save. Patch I adds TraceSave + SystemSave before the delayed
      exit, so settings and save metadata survive a quit. Device-verified as
      NRO and as the A10 NSP (docs/pilot/saveload-acceptance.md,
      docs/pilot/P4-device-runbook.md section 12.4, user m13918).
  touch:
    supported: false
    verification: unknown
    note: Citron mouse input is the first-touch path; touch was not exercised.
default_input_profile: krkr-ns
artifact_naming: "{id}-{version}.nsp"
content_layout:
  mode: romfs
  entry: game_files.txt
  destination: /kirikiri/haruno
  notes: >-
    The self-contained NSP embeds the game payload in its RomFS; on first boot
    the patch copies the files listed in romfs:/game_files.txt to
    sdmc:/kirikiri/haruno, writes the .galnx_extracted marker and autostarts
    /kirikiri/haruno/data.xp3. Mounting the additional xp3 archives stays in the
    game Init.tjs (Storages.addAutoPath), so the engine needs no change.
status: ready
status_reason: >-
  Device-verified engine for the CN pilot. The A10 NSP (version 1.0.9,
  2,870,911,704 B, sha256
  0efc23f66f57a016c15ea3944cdb8ce5b396f03f6bef3b8f5ddc1794d03186f2) passed
  real-hardware acceptance (Pilot-01, README Pilot table): the user reported the
  four v1.8 issues fixed (settings persistence, save-load text, the forced
  new/continue warning and ZR held-drag), and A10 is the delivered baseline for
  this title (docs/pilot/P4-device-runbook.md section 12.4, user m13918,
  2026-10-31). First boot copies the 23 embedded payload files (~2,843 MiB) to
  sdmc:/kirikiri/haruno and later boots use the .galnx_extracted marker; the
  install was done over DBI FTP (449.7 s, ~6.12 MiB/s) and verified with 19
  checks (18 ok, 1 unsigned warning). Limits kept on record: only this title has
  a hardware run, the nine-patch stack is not upstreamed, exit-save is
  best-effort (SystemSave + TraceSave then a 1 s delayed exit, so a hard power
  cut can still lose the last metadata write), and the engine save format is
  private to Kirikiroid2. Earlier Citron-only milestones (A2-A9) are recorded in
  docs/builds/009-015.
