# Engine descriptor for the rfvp adapter (docs/engines/README.md).
# rfvp is a Rust re-implementation of the FVP engine; GalNX adds one patch that
# replaces the CPU software rasterizer with an SDL2/GLES2 backend (60 fps in
# Citron, up from 17-19 fps). Chains: docs/builds/008-rfvp-evaluation.md (base
# build + software-rasterizer baseline), docs/builds/016-rfvp-sdl2-backend.md
# (SDL2 backend), docs/builds/017-rfvp-input.md (pad + quick save/load),
# docs/builds/018-rfvp-nsp.md (self-contained NSP via romfs), and
# docs/milestones/M5-fvp.md (M5-a..M5-m).
# Later feature lines: docs/builds/046-rfvp-h264-movie.md (H.264 + nvtegra
# movie pipeline), 047-nv12-color.md (NEON colour conversion), 048 (OP story
# trigger), 049-p41-snow-particles.md (snow particles), 050 (AKASEKA FD pilot,
# zero extra engine patches), 051 (NV12 zero-copy movie upload) and 052 (P45:
# the same engine rebuilt into the IROSEKA / MOYU pilots with user-cover icons).
id: rfvp
display_name: rfvp (FVP Rust re-implementation)
upstream_url: https://github.com/xmoezzz/rfvp
pinned_commit: 9f07adef2eb5d559777f9bf59a67b756875cb24f
pinned_version: "HEAD 9f07adef (2026-10-25); version tag 0.7.0 = 99435f22"
license_spdx: MPL-2.0
license_url: https://github.com/xmoezzz/rfvp/blob/main/LICENSE
license_notes: >-
  MPL-2.0 covers the Rust crates and the platform/switch host crate. Bundled
  third-party assets (demo games, fonts) keep their own licenses and are not
  shipped by GalNX. A redistributed binary that contains GalNX patches must
  publish the corresponding source under MPL-2.0 (per-file copyleft).
target_kind: self_contained_nsp
build_backend: custom-script
capabilities:
  graphics:
    supported: true
    verification: device_verified
    backend: sdl2-gles2
    note: >-
      SDL2/GLES2 backend via patch rfvp-sdl2-backend.patch (SDL_RenderGeometry
      sprites, custom blend modes for Multiply/Screen, GPU previous-frame
      sampling and render-target thumbnails). Device-verified on the Switch in
      the three rfvp pilots (IROSEKA / MOYU / AKASEKA title, story and OP
      screens; README Pilot table, docs/pilot/akaseka-fd-acceptance.md). An
      end-to-end story run has not been recorded, so this capability stays at
      device_verified rather than game_verified. Citron keeps a locked 60.0 fps
      at ~15.6 ms render including the vsync wait.
  movie:
    supported: true
    verification: device_verified
    backend: nvdec+nvtegra+ffmpeg
    note: >-
      H.264 OP movies through FFmpeg + nvtegra (AV_PIX_FMT_NVTEGRA): the
      decoder's NV12 planes go straight to GLES2 via SDL_UpdateNVTexture (P44
      dual-plane zero copy, docs/builds/051), with the NEON NV12->RGBA
      converter as fallback and the in-tree WMV2/WMV3/VC-1 software player for
      the older OPs. Device-verified: the user confirmed the 1080p AKASEKA OP
      plays with correct colour and no stutter (v1.4.1-test, user m40951). The
      IROSEKA / MOYU OP quality tiers (video.txt) were still awaiting their own
      user device run when this descriptor was updated.
  audio:
    supported: true
    verification: device_verified
    backend: audren
    note: >-
      libnx audren path (audio_init/audio_pump) with the P27 continuity ring and
      the P30 audio JIT (docs/builds/034-rfvp-audio-continuity.md,
      037-rfvp-audio-jit.md): the ~3 s start-up delay seen on v1.1.4-test
      hardware is fixed and device-verified on v1.1.6-test
      (docs/pilot/P4-device-runbook.md section 13.8: lag_ms within +/-300,
      underrun=0).
  input:
    supported: true
    verification: device_verified
    note: >-
      Hand-held pad mapping (docs/builds/019-rfvp-input-mapping.md, patch
      rfvp-input-remap.patch): A=Enter, B=Escape (in-game clock menu), X=toolbar
      AUTO, Y=menu LOAD, PLUS=menu SAVE, MINUS=menu EXIT + confirm, ZR=left
      mouse, ZL=right mouse, R=Ctrl skip, D-Pad=arrows, left stick=wheel, right
      stick=pointer; the in-game menus are driven by measured screen anchors.
      Device-verified by the user in the three rfvp pilots (mapping and the
      toolbar/menu entry points; README Pilot table,
      docs/pilot/akaseka-fd-acceptance.md). Full game-flow input coverage has
      not been recorded, so this stays at device_verified rather than
      game_verified.
  save:
    supported: true
    verification: device_verified
    note: >-
      Quick save / quick load to slot 0 at
      sdmc:/switch/rfvp/saves/<game-id>/save/rfvp_s000.bin, plus deferred
      snapshot materialisation (P16, docs/builds/022-rfvp-save-latency.md) and
      the consumed ExitDialog/ExitMode(3) quit path (P13). The save format is
      rfvp's own and is not interchangeable with the PC build. The earlier
      rfvp hardware runs cover the save/load path (docs/pilot/P4-device-runbook.md
      section 13 checklists) and the pilots record a clean exit, but the 0.1.0
      sign-off messages do not itemise save/load, so this capability is
      device_verified with that gap.
  touch:
    supported: false
    verification: unknown
    note: hidGetTouchScreenStates is forwarded, but the game has never been driven by touch.
default_input_profile: generic-vn
artifact_naming: "{id}-{version}.nsp"
content_layout:
  mode: romfs
  entry: default.ttf
  destination: romfs:/game
  notes: >-
    Self-contained NSP (P11, docs/builds/018-rfvp-nsp.md): the whole extracted
    game tree is packed into romfs at /game and the Switch runtime selects it
    at boot when romfs is mounted and sdmc:/switch/rfvp/game has no .hcb
    (platform/switch/runtime/main.c). The engine reads default.ttf from that
    tree as its only font (the IROSEKA_FHD data ships Sarasa Gothic SC Bold,
    which covers CJK). Saves are unaffected: they stay on SD at
    sdmc:/switch/rfvp/saves/<game-id>/. The NRO form still works and falls back
    to sdmc:/switch/rfvp/game when romfs is absent.
status: ready
status_reason: >-
  Device-verified engine: three rfvp pilots run on real hardware with the
  user's sign-off (README Pilot table, docs/pilot/0.1.0-device-acceptance.md):
  Pilot-02 IROSEKA FHD 1.2.5-test (10,087,541,464 B, sha256 f6860842...),
  Pilot-03 SAKURA MOYU 1.3.3-test (8,116,841,176 B, sha256 965ee356...) and
  Pilot-04 AKASEKA HD 1.4.1-test (6,738,209,496 B, sha256 db31a312..., signed
  off 2026-11-11 for a correct and smooth 1080p H.264 OP, user m40951). The
  earlier AKASEKA 1.4.0-test acceptance recorded OP playback, pad mapping and
  a clean exit (docs/pilot/akaseka-fd-acceptance.md, user m39477). The pilots
  stop at device_verified: story progression, save/load and a long soak were
  not itemised in the sign-offs, so no rfvp capability is recorded as
  game_verified. Limits kept on record: 720p is the default output (1080p
  needs the NV12 zero-copy path and its own per-title budget), the save format
  is private to rfvp, the IROSEKA / MOYU OP quality tiers (video.txt) and the
  WMV2 OP path still need their own device confirmation, and the H.264 movie
  pipeline only exists in the no_std build with the patched nvtegra stack.
