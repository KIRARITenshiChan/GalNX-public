  commit: 9f07adef2eb5d559777f9bf59a67b756875cb24f
patches:
  - path: docs/builds/patches/rfvp-switch/rfvp-sdl2-backend.patch
    notes: >-
      6 files, 1,238 lines. platform/switch/runtime/sdl_video.c (new) is the
      SDL2 video shim (texture upsert, pixel-format conversion, blend mapping,
      SDL_RenderGeometry quads, read-pixels thumbnail and BMP screenshot);
      runtime/main.c moves the main loop onto SDL (no appletMainLoop, no libnx
      framebuffer); host/src/render.rs forwards RfvpRenderer to the shim;
      host/src/ffi.rs reports perf averages; host/build.rs fixes the Windows
      tool probe; build_switch.sh adds SDL2/EGL flags and the link order.
  - path: docs/builds/patches/rfvp-switch/rfvp-input.patch
    notes: >-
      Incremental patch on top of rfvp-sdl2-backend.patch: 4 files +124/-4
      (crates/rfvp/src/host_api/event.rs gains QuickSave/QuickLoad;
      crates/rfvp/src/no_std_core.rs handles those events and consumes
      take_pending_save_load_request() into quick slot 0;
      platform/switch/runtime/main.c forwards the right stick;
      platform/switch/host/src/event.rs makes PLUS a hotkey modifier, emits
      wheel events from the right stick, and speeds the pointer up). The full
      HEAD-to-working-tree diff is also kept as rfvp-full.diff.
  - path: docs/builds/patches/rfvp-switch/rfvp-romfs.patch
    notes: >-
      Incremental patch on top of rfvp-sdl2-backend.patch and rfvp-input.patch:
      1 file +38/-1. platform/switch/runtime/main.c mounts romfs, detects a
      valid game root by looking for .hcb, switches to romfs:/game only when the
      SD path has no game, and logs the selected root. The matching full diff is
      57,536 B / 9 files.
  - path: docs/builds/patches/rfvp-switch/rfvp-input-remap.patch
    notes: >-
      Incremental patch on top of the previous three: 1 file +264/-56
      (platform/switch/host/src/event.rs rewritten). Rebinds the pad for the
      hand-held build (P12, docs/builds/019-rfvp-input-mapping.md). The in-game
      menus are driven by a small stage machine (Esc down/up, wait 90 polls for
      the fade-in, move the pointer to a measured anchor, left click, optional
      second anchor for the exit confirm) instead of injecting TJS. Full diff
      after this patch is rfvp-full.diff 68,536 B / 9 files.
  - path: docs/builds/patches/rfvp-switch/rfvp-device-fixes.patch
    notes: >-
      Incremental patch on top of the previous four (P13, docs/builds/020): 7
      files. platform/switch/runtime/sdl_video.c gains a console overlay (the
      pointer is drawn by GalNX because the engine only renders its cursor on
      the desktop host) plus a reusable texture/scratch path; runtime/main.c
      feeds it the pointer/dialog state every frame; host/src/event.rs turns
      MINUS into a host-side quit dialog and tracks pointer visibility;
      host/src/app.rs, host/src/ffi.rs expose and consume that state;
      crates/rfvp/src/no_std_core.rs consumes the engine's pending ExitDialog
      request and the ExitMode(3) main-script-exited condition so a native quit
      actually terminates. Full diff after this patch is rfvp-full.diff
      85,712 B / 10 files.
  - path: docs/builds/patches/rfvp-switch/rfvp-save-lazy.patch
    notes: >-
      Incremental patch on top of P14 (docs/builds/022-rfvp-save-latency.md):
      6 files +162/-19. crates/rfvp/src/subsystem/resources/save_manager.rs
      gains PendingPrepare (thumbnail + SaveStateSnapshotV1 kept unencoded until
      a real commit) and materialize_pending_local_savedata; save_state.rs drops
      the four diagnostic encodes that doubled the encoded volume; no_std_core.rs
      and app.rs follow the new signature; ring_log capacity grows to 1200 for
      the [save] trace; sdl_video.c captures the thumbnail through a small GPU
      target instead of a full 1280x720 readback. Measured on the same complex
      save: a per-line save pair went from 2x99-108 ms of postcard encoding to
      no encoding at all (5.27-5.67 ms per frame), while the real system-slot
      commits still materialize and write (commit ... ok=true).
  - path: docs/builds/patches/rfvp-switch/rfvp-cache.patch
    notes: >-
      Incremental patch on top of P16 (docs/builds/023-rfvp-resource-cache.md):
      28 files / 849 lines. Adds crates/rfvp/src/subsystem/resources/resource_cache.rs
      (process-wide LRU caches: decoded textures 160 MiB, parts 48 MiB, raw bytes
      192 MiB, 16 MiB per entry), wires it into graph_buff/load_texture +
      graph_load, parts_manager/parts_load and Vfs::read_file, prefetches the
      graph/ UI textures at boot through Vfs::list_by_prefix, converts the BGRA
      ->RGBA pixel loops to chunked copies + ImageBuffer::from_raw, and switches
      the inflate backend to devkitPro zlib via the switch-zlib feature
      (build_switch.sh links -lz). Result in Citron with the real complex save:
      reopening the ESC menu twice produces byte-identical screenshots with no
      decode/save slow frames (graph cache hit 193, vfs cache hit 106), and the
      66-texture prefetch decode drops from 204.4 ms (miniz) to 133.7 ms (zlib).
      Full diff after this patch is rfvp-full.diff 154,886 B / 3,950 lines.
  - path: docs/builds/patches/rfvp-switch/rfvp-async-decode.patch
    notes: >-
      Incremental patch on top of P17 (docs/builds/024): 17 files / 1,090 lines.
      Adds crates/rfvp/src/subsystem/resources/async_decode.rs (REQUESTED /
      QUEUE / PENDING / DONE tables, KIND_GRAPH / KIND_PARTS / KIND_GRAPH_PREFETCH,
      ASYNC_INLINE_MIN_BYTES = 1 MiB) and wires it into vfs.rs (pack_location),
      graph.rs / parts.rs (submit instead of decode) and graph_buff.rs /
      parts_manager.rs (apply_snapshot_v1 takes an async id, so a restore queues
      big textures instead of decoding them inline). no_std_core.rs gains
      apply_async_decodes with a requested_ok guard against stale results;
      platform/switch/host/src/decode.rs exports rfvp_switch_decode_step and
      runtime/main.c runs it on a threadCreate worker. Measured in Citron: CG
      entry 632.2 -> 299.1 -> 273.4 ms on byte-identical screenshots, restore
      queues big sheets while small UI textures stay cached. Full diff after this
      patch is rfvp-full.diff 190,338 B / 4,859 lines. Two negative results are
      documented: returning Nil for big loads broke the load ordering, and
      libdeflate crashed at start-up (reverted to zlib).
  - path: docs/builds/patches/rfvp-switch/rfvp-async-toggle.patch
    notes: >-
      Incremental patch on top of P18 (docs/builds/025-rfvp-async-toggle.md):
      4 files +189/-137. crates/rfvp/src/subsystem/resources/async_decode.rs gains
      async_enabled() (extern C rfvp_switch_async_enabled() under no_std) and
      guards the five entry points so a disabled switch falls back to synchronous
      decode; platform/switch/runtime/main.c reads sdmc:/switch/rfvp/async.txt
      (on/ON/1 = enabled, default off), checks threadCreate/threadStart results,
      writes sdmc:/switch/rfvp/async_status.txt (enabled/create/start/heartbeat)
      and keeps a worker heartbeat; platform/switch/host/Cargo.toml bumps the
      artifact version to 1.0.7. Citron NRO smoke with the default off:
      nonblack 0.9018, exception 0, async_status enabled=0 create=0x0 start=0x0.
      Full diff after this patch is rfvp-full.diff 194,079 B / 4,968 lines.
  - path: docs/builds/patches/rfvp-switch/rfvp-async-watchdog.patch
    notes: >-
      Incremental patch on top of P19 (docs/builds/026-rfvp-async-watchdog.md):
      5 files +145/-31. crates/rfvp/src/subsystem/resources/async_decode.rs gains
      report_stage (0 idle / 1 pop / 2 read / 3 decode / 4 publish),
      watchdog_stalled (3 s without pending-count progress) and drain_inline
      (decodes the queue on the main thread), and routes every job through a
      shared finish_job; no_std_core::apply_async_decodes runs the watchdog before
      applying results; platform/switch/runtime/main.c exposes
      rfvp_switch_async_stage / rfvp_switch_async_disable, writes stage= into
      async_status.txt every 600 frames, and raises the worker stack to 0x100000;
      platform/switch/host/Cargo.toml bumps the version to 1.0.8. Citron with async
      forced on: nonblack 0.9018, async_status enabled=1 hb=77000 stage=0, no
      last_error.txt. Full diff after this patch is rfvp-full.diff 198,586 B /
      5,082 lines / 33 files.
  - path: docs/builds/patches/rfvp-switch/rfvp-wmv2-padding.patch
    notes: >-
      Incremental patch on top of P33 (docs/builds/040-wmv2-left-edge.md):
      1 file / 101 lines (crates/na_wmv_player/src/api.rs). WMV2 frames are now
      decoded on a 16-pixel macroblock-aligned surface (coded_width/height,
      854 -> 864) and cropped back to the display size, the same pattern
      Wmv3/WVC1 already used in this crate. The WMV2 IDCT write path had no row
      guard, so the last macroblock column of the 854-wide frame spilled into
      the first pixels of the next row - that was the vertical mosaic column on
      the left edge of the OP. Host oracle vs ffmpeg on the same frame:
      mean |dY| 2.918 -> 1.470, |dY|>32 pixels 6,777 -> 30, left 12 columns
      63.35 -> 3.36, spill rows 58 -> 0; the visible size stays 854x480.
  - path: docs/builds/patches/rfvp-switch/P40-op-h264.diff
    notes: >-
      H.264 OP movie pipeline on top of P33 (docs/builds/046-rfvp-h264-movie.md):
      platform/switch/runtime/rfvp_movie_h264.c/.h (FFmpeg + nvtegra, get_format
      prefers AV_PIX_FMT_NVTEGRA), NEON NV12/YUV420P -> RGBA converter
      rfvp_movie_color.c, Rust crates/rfvp/src/subsystem/resources/videoplayer/
      horizon_h264.rs (MovieSource), horizon.rs tries movie/NN_h264.mp4 first and
      falls back to WMV2, build_switch.sh links three static FFmpeg libs. The
      movie debug markers (movie_debug.txt "movie=1", h264_sw.txt for CPU-only
      emulator runs) live in the same C file.
  - path: docs/builds/patches/rfvp-switch/P40b-nv12-color.diff
    notes: >-
      Fixes the NEON chroma addressing in rfvp_movie_color.c (uvr+(i>>1) ->
      uvr+i / uvr+i+8) so colour frames are no longer horizontally stretched;
      device-verified on iroseka/moyu OP (v1.2.1-test).
  - path: docs/builds/patches/rfvp-switch/P40c-op-story-trigger.diff
    notes: >-
      Removes the debug auto-play of movie/01 at boot; the OP now plays through
      the game's own story trigger and is skippable (v1.2.2-test).
  - path: docs/builds/patches/rfvp-switch/P41-snow-particles.diff
    notes: >-
      Three-layer snow particle fix on top of P40c (docs/builds/049,
      232 lines / 7 files): subtitle/components/syscalls/other_anm.rs widens the
      snow arg10 range to -65535..=65535 (moyu passes 2000/2500),
      rendering/prim_commands.rs uses the snow mode as texture id
      (prim_set_texture_id(id, mode)) so both snow prims no longer share
      texture 0, and emit_snow falls back to base_tex when a variant graph has
      not been uploaded yet. Time-differential density 1.33 -> 5.52 -> 39.46.
  - path: docs/builds/patches/rfvp-switch/rfvp-nv12-zerocopy.patch
    notes: >-
      P44 dual-plane zero copy on top of P41 (docs/builds/051-rfvp-nv12-zerocopy.md):
      13 files / 785 lines / +446-24. sdl_video.c gains FormatNv12, a cached
      NV12 soft-renderer probe (SDL_CreateTexture(SDL_PIXELFORMAT_NV12), forced off by
      sdmc:/switch/rfvp/nv12_off.txt) and galnx_sdl_texture_create_nv12() which feeds
      SDL_UpdateNVTexture so the GLES2 YUV->RGB shader runs on the GPU;
      rfvp_movie_h264.c gains galnx_movie_stage_nv12() (tight Y plane + interleaved UV);
      MovieFrame/GraphBuff carry an optional nv12 plane pair through
      RfvpRenderer::create_texture_nv12 (default Unsupported, so every other platform
      keeps the RGBA path); graph snapshots skip NV12 graphs because they are decoder
      scratch. Citron A/B, 1080p H.264 OP: CPU convert 9.25 -> 1.81 ms, upload
      6.75 -> 2.72 ms (8.29 -> 3.11 MB, 1.5 B/px), ~9.5 ms saved per frame; the NSP
      smoke logs "upload=nv12" and 2.80 ms upload over 60 frames.
portlibs:
  - name: sdl2
    version: "2.28.5-4"
    source_url: https://github.com/devkitPro/pacman-packages
    recipe: devkitPro pacman switch-sdl2
    notes: >-
      devkitPro portlib rather than an in-tree recipe; provide
      include/SDL2/SDL.h and lib/libSDL2.a under $DEVKITPRO/portlibs/switch.
      Do not use sdl2-config output: it hard-codes MSYS paths.
build:
  workdir: "."
  env:
    DEVKITPRO: D:/devkitPro
    RFVP_CONSOLE_NIGHTLY: nightly-2026-02-01
  commands:
    - bash platform/switch/build_switch.sh
