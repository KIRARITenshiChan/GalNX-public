  notes: >-
    Pilot-04 (AKASEKA HD, v1.4.1-test) is the latest device acceptance: the
    1080p H.264 OP plays with correct colour and no stutter (user m40951), and
    the earlier 1.4.0-test run recorded pad mapping and a clean exit (user
    m39477). Pilot-02 / Pilot-03 were accepted with 1.2.5-test / 1.3.3-test
    (P45 rebuilds, user m41226; docs/builds/052). None of these sign-offs
    included story progression, save/load or a long soak, so the engine and
    its graphics/input capabilities stay at device_verified rather than
    game_verified. Firmware and Atmosphere versions were not recorded, so
    those fields are left empty.

source:
