    name: FFmpeg（averne/FFmpeg nvtegra 分支，--enable-gpl 构建）
    upstream: https://github.com/averne/FFmpeg
    version_or_commit: caeec83b791be08ed43468a2ef426d6901d51c78（nvtegra 分支 tip，2024-10-06；本地构建于 2026-11-09/10）
    license_spdx: GPL-2.0-or-later
    license_name: GNU General Public License v2 or later（FFmpeg 配置自报 GPL version 2 or later）
    license_url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
    license_family: copyleft
