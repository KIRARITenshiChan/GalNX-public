# 字段约定：
# - license_spdx：SPDX 标识符；无法映射到 SPDX 时写空字符串并用 license_name + license_url，
#   或写 NOASSERTION 并给出 license_name + license_url 与 notes 说明。
# - license_family：permissive / weak-copyleft / copyleft / custom / public-domain / unknown。
# - link_mode：static / dynamic / none / na（none=不参与链接；na=资源/工具）。
# - distribution_class：runtime-linked / runtime-bundled / build-only / development-only。
# - included_in_nsp=true 的组件必须给出 artifacts（scope.artifacts 中的 id）。
# - obligations 词表（自由文本，建议使用）：include_license_text / include_copyright_notice /
#   provide_corresponding_source / provide_relink_mechanism / state_modifications /
#   no_additional_restrictions / restriction_no_rar_reimplementation / no_redistribution_until_permission。
# - evidence 条目：{type: repo|local|url, path|ref|url, note}；repo.path 是仓库相对路径且必须存在。
