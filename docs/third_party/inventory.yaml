      - no_additional_restrictions
      - provide_build_scripts
    evidence:
      - type: local
        ref: /e/galnx-build/nvdec/ffmpeg-build-nvtegra/config.h
        note: >-
          FFMPEG_CONFIGURATION 含 --enable-gpl --enable-nvtegra
          --enable-hwaccel='vc1_nvtegra,wmv3_nvtegra,h264_nvtegra'；
          FFMPEG_LICENSE "GPL version 2 or later"；CONFIG_GPL=1
      - type: local
        ref: /e/galnx-build/nvdec/research/ffmpeg-nvtegra/configure
        note: 第 3156 行 nvtegra_deps="gpl"（nvtegra 硬依赖 GPL；去掉 --enable-gpl 无法启用 nvtegra）
      - type: local
        ref: /e/galnx-build/nvdec/research/ffmpeg-nvtegra/libavcodec/nvtegra_decode.c
        note: 文件头声明 GNU GPL v2 or later（Copyright (c) 2024 averne）
      - type: local
        ref: /e/galnx-build/p40/rfvp/target/rfvp-switch-runtime/rfvp.elf
        note: >-
          20,418,056 B sha256 296b198c6b1dc970ed6544cac40c0c4da97bf581dda031c0a8acb4cc0a073973；
          静态链接证据：578 个 SDL_/av*/nx_ 等前缀符号 + 1249 个 C++ 修饰符号；
          ELF 中 libdeflate 符号 0 个，deflate_/inflate_ 符号来自 zlib
      - type: repo
        path: docs/builds/046-op-h264-nvtegra.md
        note: NVDEC 接入与打包记录（L87-L143）
    notes: >-
      事实：--enable-gpl 不是可选装饰，而是 nvtegra hwaccel 的前置条件（configure:3156
      nvtegra_deps="gpl"）；保留 NVDEC 就必须接受 GPL。GalNX 决策 B（2026-11-11 拍板）：
      保留 NVDEC，rfvp/NSP 整体按 GPL-2.0-or-later 组合作品处理。GalNX 公共仓库不包含任何
      NSP 二进制（只发布 MIT 编排层与上游 MPL/MIT 补丁）；NSP 由用户本机构建/安装，属于
      GPL 组合作品的私有使用。若将来对外分发 NSP，分发义务 = 提供对应源码（rvfp fork、
      FFmpeg nvtegra 分支 caeec83b、构建脚本）与 GPL-2.0 文本。方案 A（去 NVDEC 改软解）
      已否决：会推翻 P40/P44 已验收的 60fps 硬解成果（probe9 硬解 decode 0.44 ms）。

